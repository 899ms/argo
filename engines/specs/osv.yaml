# OSV.dev — 开源软件漏洞库（免 key、免注册，跨生态聚合）
#
# 补的盲区：**「这个包有没有已知漏洞」**。这是结构化事实而非网页检索问题——
# 搜「xxx package 有漏洞吗」只能得到博客与二手解读，而 OSV 直出
# 包 → 漏洞 → 影响版本区间，标准化且可交叉验证。
#
# 与已有源的分工（互补而非重复）：
#   nvd  —— CVE 编号/CVSS 严重度（NIST 官方口径，按关键词查）
#   osv  —— **按包与生态**查询，聚合 GHSA / PyPA / Go / RustSec 等上游
#   GitHub Advisory —— 是 OSV 的上游之一，且未认证实测 403 rate limit，
#                      故不单独接入（OSV 已聚合其数据）
#
# 端点语义（实测 2026-09-16）：只能 POST，GET 返回 405。
#   POST /v1/query  {"package":{"name":"requests","ecosystem":"PyPI"}}
#   → vulns[]（实测 16 条）
# 生态取值：PyPI / npm / Go / crates.io / Maven / NuGet / Packagist / RubyGems。
# 查询词传裸包名；带生态前缀（如 pypi:requests）时由 osv 生态映射处理。
#
# 验证:
#   python3 scripts/engine_validate.py --engine osv --stage health --admit
#   python3 scripts/search.py "requests" --engine osv --json

engine_id: osv
type: osv
enabled: true
cost_tier: free
label: OSV 开源漏洞库
family: security
priority: 44
qps: 2
period: second
cost_per_call: 0.0
cost_unit: free
method: POST
url: https://api.osv.dev/v1/query
timeout: 15
canary_query: "requests"
desc: "OSV.dev 开源漏洞库（按包查已知漏洞与影响版本区间，免 key；生态 PyPI/npm/Go/crates 等）"
coverage: [security, package]
recommended: false
latency_ms: 1500

headers:
  Content-Type: application/json

# body 由 builder 填充：生态需按包名推断（PyPI vs npm 同名包不同），
# 声明式 body 无法表达该推断，见 scripts/engines_builders_tech.py 的 osv builder。

quality_queries:
  - query: "requests"
  - query: "lodash"
  - query: "log4j-core"
