# 天气查询（免 Key）
# 数据源: wttr.in（主用，免费公开）+ Open-Meteo（兜底，需要坐标）
# 能力: 按地点名（城市/机场码/邮编）或坐标查询当前天气与未来预报
# 实现: scripts/wx.py（纯标准库，输出结构化 YAML 结果列表）
# 验证:
#   python3 scripts/engine_validate.py --engine weather --stage all --admit
#   python3 scripts/search.py "上海天气" --engine weather --json

engine_id: weather
type: cli
enabled: true
cost_tier: free
cmd:
- python3
- scripts/wx.py
search_args:
- '{query}'
- --n
- '{n}'
output_format: yaml
timeout: 15
canary_query: "Shanghai"
desc: "天气查询（免 Key：wttr.in 主用 + Open-Meteo 兜底，当前+未来预报）"
coverage: [weather, forecast, geo]
recommended: false
# 数据型源：回答的是天气数据而非与查询词面匹配的文档，相关性判据不适用。
# 实证：canary "Shanghai" 返回 wttr.in 的中文本地化结果（「上海…」），拉丁
# 查询配 CJK 输出零词面交集，2026-09-16 实测被相关性门判负——同热榜类，
# 标准不降，只是问错了问题。
relevance_check: false

family: misc_vertical
