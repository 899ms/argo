# CISA KEV — 已知被在野利用漏洞目录（免 key、免注册）
#
# 补的盲区：**「这个漏洞是不是正在被真实攻击利用」**。这是修复优先级里权重最高
# 的一档信息——NVD 给 CVSS 分数（理论严重度），OSV 给影响版本，而 KEV 给的是
# 官方确认「已被实际利用」的名单。三者互补，构成安全域的完整判断链。
#
# 数据形态（实测 2026-09-16）：**单个 JSON 全量文件**，约 1.35MB、1710 条。
#   https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
#   {"catalogVersion":"2026.09.14","vulnerabilities":[{cveID, vendorProject,
#     product, vulnerabilityName, dateAdded, shortDescription, dueDate, ...}]}
# 上游**不支持查询参数**（实测 ?q= 无效，仍返回全量），因此必须本地过滤：
# 按查询词匹配 cveID / vendor / product / name / description。
#
# 约束与取舍：每次查询下载 1.35MB。为避免把带宽与延迟花在无关查询上，
# 本引擎声明 explicit_only + 低 priority，只在用户明确要「在野利用/KEV」类
# 信息时被选中，不参与通用路由。
#
# 验证:
#   python3 scripts/engine_validate.py --engine cisa_kev --stage health --admit
#   python3 scripts/search.py "chrome" --engine cisa_kev --json

engine_id: cisa_kev
type: cisa_kev
enabled: true
cost_tier: free
label: CISA KEV 在野利用漏洞
family: security
priority: 47
qps: 1
period: second
cost_per_call: 0.0
cost_unit: free
timeout: 30
canary_query: "chrome"
coverage:
- security
desc: "CISA 已知被在野利用漏洞目录（官方确认已被实际攻击利用的 CVE；全量 1.35MB 本地过滤）"
recommended: false
latency_ms: 4000

quality_queries:
  - query: "chrome"
  - query: "CVE-2021-44228"
